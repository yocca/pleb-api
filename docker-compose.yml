# Local development for Pleb. Check out pleb-web and pleb-agent next to this repo.
#
#   docker compose up                          # db, migrations, seed data and the API on :8080
#   docker compose --profile web up            # ...plus the web app on :3000
#   docker compose --profile agent run agent … # run a pleb-agent job
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pleb
      POSTGRES_PASSWORD: pleb
      POSTGRES_DB: pleb
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # -h forces TCP, which only comes up after the image finishes its init restart
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pleb", "-d", "pleb"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://pleb:pleb@db:5432/pleb?sslmode=disable
    depends_on:
      db: { condition: service_healthy }

  seed:
    image: postgis/postgis:16-3.4
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed.sql"]
    environment:
      PGHOST: db
      PGUSER: pleb
      PGPASSWORD: pleb
      PGDATABASE: pleb
    volumes: [./dev:/seed:ro]
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: .
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://pleb:pleb@db:5432/pleb?sslmode=disable
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ../pleb-web
    profiles: ["web"]
    environment:
      PLEB_API_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]

  agent:
    build: ../pleb-agent
    profiles: ["agent"]
    env_file: [{ path: ../pleb-agent/.env, required: false }]
    environment:
      DATABASE_URL: postgres://pleb:pleb@db:5432/pleb
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata: {}
